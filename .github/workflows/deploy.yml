name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'heirest-backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'heirest-frontend' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Continuous Integration (Tests & Build Checks)
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirest_jewelry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies & Run Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heirest_jewelry?schema=public"
          JWT_SECRET: "heirest-super-secret-test-jwt-key-2026"
          REDIS_URL: "redis://localhost:6379"
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
          npm run test

      - name: Validate Frontend Production Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Continuous Delivery (Build & Push Docker to AWS ECR)
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to Amazon ECR
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.image-meta.outputs.registry }}
      backend_image: ${{ steps.image-meta.outputs.backend_image }}
      frontend_image: ${{ steps.image-meta.outputs.frontend_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Image Metadata
        id: image-meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          BACKEND_TAG="${REGISTRY}/${{ env.ECR_BACKEND_REPO }}:latest"
          FRONTEND_TAG="${REGISTRY}/${{ env.ECR_FRONTEND_REPO }}:latest"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.image-meta.outputs.backend_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.image-meta.outputs.frontend_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Continuous Deployment (Zero-Downtime EC2 Rolling Update)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_DIR: ${{ vars.APP_DIR || '/home/ubuntu/heirest' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: AWS_REGION,ECR_REGISTRY,BACKEND_IMAGE,FRONTEND_IMAGE,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,APP_DIR
          script: |
            set -e
            APP_DIR="${APP_DIR:-/home/ubuntu/heirest}"
            cd "$APP_DIR"

            # Sync updated configuration and scripts
            git pull origin main || true
            chmod +x deploy.sh

            echo "🚀 Deploying with images:"
            echo "   Registry: ${ECR_REGISTRY}"
            echo "   Backend:  ${BACKEND_IMAGE}"
            echo "   Frontend: ${FRONTEND_IMAGE}"

            ./deploy.sh
